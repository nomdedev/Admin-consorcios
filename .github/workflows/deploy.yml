name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all applications
        run: npm run build

  deploy-database:
    name: Deploy Database
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: ./scripts/deploy-db.sh

  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    needs: deploy-database
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Railway
        run: |
          echo "Triggering Railway deploy..."
          # Railway deploy is triggered automatically via GitHub integration
          # If manual trigger is needed, add Railway CLI here
          echo "✅ Railway deploy triggered"

  deploy-frontend:
    name: Deploy Frontend Apps
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy Admin Web to Vercel
        run: |
          echo "✅ Admin Web deploy triggered via Vercel GitHub integration"

      - name: Deploy Resident App to Vercel
        run: |
          echo "✅ Resident App deploy triggered via Vercel GitHub integration"

      - name: Deploy Staff App to Vercel
        run: |
          echo "✅ Staff App deploy triggered via Vercel GitHub integration"

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployments to be ready
        run: |
          echo "⏳ Waiting for Railway API deployment..."
          sleep 180  # 3 minutes for Railway to deploy

      - name: Run smoke tests
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          ADMIN_WEB_URL: ${{ secrets.PROD_ADMIN_WEB_URL }}
          RESIDENT_APP_URL: ${{ secrets.PROD_RESIDENT_APP_URL }}
          STAFF_APP_URL: ${{ secrets.PROD_STAFF_APP_URL }}
        run: ./scripts/smoke-test.sh ${{ secrets.PROD_API_URL }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Smoke tests failed!"
          echo "Check the deployment and fix issues before retrying"
          exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "🎉 All deployments successful!"
          echo "VecinoSimple is now live in production"